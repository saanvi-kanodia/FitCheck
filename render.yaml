services:
  - type: web
    name: fitcheck
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      # Challenge scores are kept in the Postgres database below, so they survive deploys.
      - key: DATABASE_URL
        fromDatabase:
          name: fitcheck-db
          property: connectionString
      # Signs analysis results so challenge scores can't be faked; Render generates it once.
      - key: FITCHECK_SECRET
        generateValue: true
      # Labelled sample scores on the challenge boards: 1 shows them, 0 removes them (real scores stay).
      - key: FITCHECK_SAMPLE_SCORES
        value: "0"

databases:
  - name: fitcheck-db
    plan: free
    databaseName: fitcheck
